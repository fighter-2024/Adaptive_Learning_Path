name: quality-gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: server
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Credential scan
        run: python server/scripts/check_secrets.py

      - name: Backend tests
        working-directory: server
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install admin dependencies from lockfile
        working-directory: admin
        run: npm ci --no-audit --no-fund

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Verify admin management route smoke mappings
        working-directory: admin
        run: npm run verify:routes

      - name: Verify admin request error classifications
        working-directory: admin
        run: npm run verify:request-errors

      - name: Verify M5 admin page semantics
        working-directory: admin
        run: npm run verify:m5

      - name: Install UniApp dependencies from lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify frontend authentication configuration
        working-directory: frontend
        run: npm run verify:auth

      - name: Verify frontend session initialization lifecycle
        working-directory: frontend
        run: npm run verify:session-init

      - name: Verify frontend App startup session isolation
        working-directory: frontend
        run: npm run verify:app-startup

      - name: Verify frontend diagnosis entry
        working-directory: frontend
        run: npm run verify:diagnosis-entry

      - name: Verify frontend learning entry
        working-directory: frontend
        run: npm run verify:learning-entry

      - name: Verify frontend home entry and current-user statistics
        working-directory: frontend
        run: npm run verify:home-entry

      - name: Verify frontend AI history and rendering
        working-directory: frontend
        run: npm run verify:ai-history

      - name: Build H5
        working-directory: frontend
        run: npm run build:h5

      - name: Build WeChat mini program
        working-directory: frontend
        run: npm run build:mp-weixin
